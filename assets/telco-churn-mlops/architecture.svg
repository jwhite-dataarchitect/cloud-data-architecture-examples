<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="780" viewBox="0 0 1120 780" role="img" aria-labelledby="title description">
  <title id="title">Telco churn data, model, and delivery boundaries</title>
  <desc id="description">CSV preparation loads BigQuery with separate warehouse checks. Dagster defines extraction and training with shared preprocessing. Artifact registration and serving handoffs remain unverified. A separate GitHub Actions path defines federated authentication, Cloud Build, and Cloud Run delivery. Terraform currently declares deployment IAM and federation only. No cloud execution is implied.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1120" height="780" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" fill="#0f172a" text-anchor="middle">
    <text x="560" y="34" font-size="23" font-weight="bold">Telco churn: data, model, and delivery boundaries</text>
    <text x="560" y="60" font-size="14">Implementation map - not a verified cloud deployment</text>
    <g fill="#e0f2fe" stroke="#0369a1" stroke-width="2">
      <rect x="35" y="100" width="220" height="85" rx="9"/>
      <rect x="350" y="100" width="220" height="85" rx="9"/>
      <rect x="710" y="100" width="350" height="85" rx="9"/>
      <rect x="350" y="265" width="220" height="95" rx="9"/>
      <rect x="710" y="265" width="350" height="95" rx="9"/>
      <rect x="350" y="440" width="220" height="90" rx="9"/>
      <rect x="710" y="440" width="350" height="90" rx="9"/>
      <rect x="35" y="625" width="220" height="75" rx="9"/>
      <rect x="350" y="625" width="220" height="75" rx="9"/>
      <rect x="710" y="625" width="350" height="75" rx="9"/>
    </g>
    <g font-size="17">
      <text x="145" y="135">CSV preparation</text>
      <text x="145" y="161">Normalize and replace</text>
      <text x="460" y="135">BigQuery staging</text>
      <text x="460" y="161">Training source</text>
      <text x="885" y="135">Warehouse validation</text>
      <text x="885" y="161">Separate entry point; not a training gate</text>
      <text x="460" y="300">Dagster extraction</text>
      <text x="460" y="326">Weekly job definition</text>
      <text x="885" y="298">Preprocessing + logistic regression</text>
      <text x="885" y="325">Split before fitting; serialize pipeline</text>
      <text x="460" y="476">GCS / Vertex registry</text>
      <text x="460" y="503">Separate upload path</text>
      <text x="885" y="476">FastAPI / Cloud Run</text>
      <text x="885" y="503">Packaged local model; typed requests</text>
      <text x="145" y="656">GitHub Actions</text>
      <text x="145" y="682">Tests and WIF auth</text>
      <text x="460" y="656">Cloud Build</text>
      <text x="460" y="682">Image / registry path</text>
      <text x="885" y="656">Cloud Run delivery definition</text>
      <text x="885" y="682">Separate from model promotion</text>
    </g>
    <g fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)">
      <path d="M255 142 H350"/>
      <path d="M570 142 H710"/>
      <path d="M460 185 V265"/>
      <path d="M570 312 H710"/>
      <path d="M255 662 H350"/>
      <path d="M570 662 H710"/>
      <path d="M885 625 V530"/>
    </g>
    <g fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)">
      <path d="M795 360 V398 H460 V440"/>
      <path d="M975 360 V440"/>
    </g>
    <g font-size="13">
      <text x="640" y="128">Check staging</text>
      <text x="630" y="299">Asset dependency</text>
      <text x="600" y="389">Artifact / registration alignment open</text>
      <text x="1010" y="400">Handoff</text>
      <text x="1010" y="417">unverified</text>
      <text x="460" y="556">Vertex endpoint script is a separate serving path</text>
      <text x="560" y="590">Solid: defined flow | Dashed: unverified model handoff | No automatic registry-to-API promotion</text>
    </g>
    <text x="560" y="739" font-size="16" font-weight="bold">Terraform: deployment IAM and federation only; full infrastructure lifecycle remains open</text>
    <text x="560" y="763" font-size="13">Conceptual diagram - no code, cloud identifiers, private endpoints, or operational configuration</text>
  </g>
</svg>
