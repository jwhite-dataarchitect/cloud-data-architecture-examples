<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" role="img" aria-labelledby="title description">
  <title id="title">Completed Telco churn demonstration with Cloud Run serving</title>
  <desc id="description">Data preparation and warehouse checks support BigQuery staging. Dagster extraction and retraining produce a fitted preprocessing and classifier artifact. FastAPI serves the model on Cloud Run. GitHub Actions uses federated authentication for image build and Cloud Run delivery. Model registration is separate from serving. Owner-verified October 18, 2026; not a live resource inventory.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1120" height="700" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" fill="#0f172a" text-anchor="middle">
    <text x="560" y="35" font-size="23" font-weight="bold">Telco churn: completed demonstration</text>
    <text x="560" y="62" font-size="14">Owner-verified October 18, 2026 - Cloud Run is the final serving platform</text>
    <g fill="#e0f2fe" stroke="#0369a1" stroke-width="2">
      <rect x="35" y="105" width="285" height="90" rx="9"/>
      <rect x="410" y="105" width="285" height="90" rx="9"/>
      <rect x="785" y="105" width="300" height="90" rx="9"/>
      <rect x="410" y="290" width="285" height="90" rx="9"/>
      <rect x="785" y="290" width="300" height="90" rx="9"/>
      <rect x="35" y="475" width="285" height="90" rx="9"/>
      <rect x="410" y="475" width="285" height="90" rx="9"/>
      <rect x="785" y="475" width="300" height="90" rx="9"/>
    </g>
    <g font-size="17">
      <text x="177" y="139">CSV preparation</text>
      <text x="177" y="166">Warehouse checks</text>
      <text x="552" y="139">BigQuery staging</text>
      <text x="552" y="166">Normalized customer data</text>
      <text x="935" y="139">Dagster</text>
      <text x="935" y="166">Extraction / scheduled retraining</text>
      <text x="552" y="324">Fitted model artifact</text>
      <text x="552" y="351">Preprocessing + classifier</text>
      <text x="935" y="324">FastAPI on Cloud Run</text>
      <text x="935" y="351">Typed batch inference</text>
      <text x="177" y="509">GitHub Actions</text>
      <text x="177" y="536">Tests / federated authentication</text>
      <text x="552" y="509">Cloud Build</text>
      <text x="552" y="536">Container image</text>
      <text x="935" y="509">Cloud Run delivery</text>
      <text x="935" y="536">Application release</text>
    </g>
    <g fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)">
      <path d="M320 150 H410"/>
      <path d="M695 150 H785"/>
      <path d="M935 195 V240 H552 V290"/>
      <path d="M695 335 H785"/>
      <path d="M320 520 H410"/>
      <path d="M695 520 H785"/>
      <path d="M935 475 V380"/>
    </g>
    <g font-size="13">
      <text x="747" y="321">Package</text>
      <text x="552" y="413">Model registration is separate from online serving; registry use does not require a Vertex endpoint.</text>
      <text x="560" y="606">Serving decision: Cloud Run replaced Vertex AI endpoint serving due to container conventions and required parameters.</text>
    </g>
    <text x="560" y="644" font-size="16" font-weight="bold">Terraform: deployment IAM and federation - keyless identity is not a production certification</text>
    <text x="560" y="675" font-size="13">Logical architecture, not a live inventory - no implementation code, cloud identifiers, or private configuration</text>
  </g>
</svg>
