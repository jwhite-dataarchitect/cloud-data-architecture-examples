<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title description">
  <title id="title">Serverless ingestion architecture</title>
  <desc id="description">Cloud Build publishes to Artifact Registry, which supplies Cloud Run. Scheduler invokes Cloud Run. Source data is transferred to a destination. Secret Manager supplies configuration. Logging and Monitoring deliver email notifications. Terraform declares infrastructure and IAM.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1000" height="520" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" fill="#0f172a" text-anchor="middle">
    <text x="500" y="34" font-size="23" font-weight="bold">Serverless ingestion: data, control, and observability</text>
    <g fill="#e0f2fe" stroke="#0369a1" stroke-width="2">
      <rect x="35" y="70" width="180" height="60" rx="9"/>
      <rect x="285" y="70" width="180" height="60" rx="9"/>
      <rect x="690" y="70" width="235" height="60" rx="9"/>
      <rect x="35" y="220" width="180" height="75" rx="9"/>
      <rect x="355" y="210" width="290" height="95" rx="9"/>
      <rect x="785" y="220" width="180" height="75" rx="9"/>
      <rect x="35" y="370" width="180" height="60" rx="9"/>
      <rect x="355" y="370" width="160" height="60" rx="9"/>
      <rect x="580" y="370" width="160" height="60" rx="9"/>
      <rect x="805" y="370" width="160" height="60" rx="9"/>
    </g>
    <g font-size="17">
      <text x="125" y="106">Cloud Build</text>
      <text x="375" y="106">Artifact Registry</text>
      <text x="807" y="106">Cloud Scheduler</text>
      <text x="125" y="251">Simulated source</text><text x="125" y="277">Cloud Storage</text>
      <text x="500" y="239">Cloud Run Job / rclone</text><text x="500" y="266">Attached identity</text><text x="500" y="291">Keyless transfer</text>
      <text x="875" y="251">Destination</text><text x="875" y="277">Cloud Storage</text>
      <text x="125" y="406">Secret Manager</text>
      <text x="435" y="406">Cloud Logging</text>
      <text x="660" y="406">Monitoring</text>
      <text x="885" y="406">Email</text>
    </g>
    <g fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)">
      <path d="M215 100 H285"/>
      <path d="M375 130 V175 H450 V210"/>
      <path d="M807 130 V170 H560 V210"/>
      <path d="M215 258 H355"/>
      <path d="M645 258 H785"/>
      <path d="M125 370 V330 H400 V305"/>
      <path d="M500 305 V340 H435 V370"/>
      <path d="M515 400 H580"/>
      <path d="M740 400 H805"/>
    </g>
    <text x="683" y="165" font-size="13">Authenticated invocation</text>
    <text x="270" y="323" font-size="13">Runtime configuration</text>
    <text x="500" y="478" font-size="17" font-weight="bold">Terraform: infrastructure and IAM, reviewed operator-driven changes</text>
    <text x="500" y="502" font-size="13">Conceptual diagram - no deployment identifiers or private endpoints</text>
  </g>
</svg>
